<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arena Wave Shooter</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: sans-serif;
    }
    #game-container {
      width: 100%;
      height: 100%;
    }
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 10px;
      height: 10px;
      background-color: rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    #hud {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #fff;
      font-size: 20px;
      font-weight: bold;
      text-shadow: 2px 2px 4px #000;
      pointer-events: none;
    }
    #instructions {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }
    #instructions h1 { font-size: 48px; margin-bottom: 10px; }
    #instructions p { font-size: 20px; color: #ccc; }
  </style>
  <!-- Three.js and PointerLockControls from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="game-container"></div>
  <div id="crosshair"></div>
  <div id="hud">
    <div>HEALTH: <span id="health">100</span></div>
    <div>WAVE: <span id="wave">1</span></div>
    <div>ENEMIES: <span id="enemies">0</span></div>
  </div>

  <div id="instructions">
    <h1>CLICK TO PLAY</h1>
    <p>WASD to Move | MOUSE to Look | LEFT CLICK to Shoot</p>
  </div>

  <script>
    // --- GAME STATE ---
    let health = 100;
    let wave = 1;
    let enemies = [];
    let destructibles = [];
    let bullets = [];

    // --- THREE.JS SETUP ---
    const container = document.getElementById('game-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x111116, 0.015);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    // --- LIGHTING ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
    scene.add(ambientLight);

    const pointLight = new THREE.PointLight(0xffaa44, 1, 50);
    pointLight.position.set(0, 15, 0);
    pointLight.castShadow = true;
    scene.add(pointLight);

    // --- ENVIRONMENT (ARENA ROOM) ---
    const roomSize = 60;
    
    // Floor
    const floorGeo = new THREE.PlaneGeometry(roomSize, roomSize);
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x222225, roughness: 0.8 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    // Walls
    const wallMat = new THREE.MeshStandardMaterial({ color: 0x333338, roughness: 0.6 });
    const wallHeight = 15;
    
    const createWall = (x, z, ry, width) => {
      const wallGeo = new THREE.PlaneGeometry(width, wallHeight);
      const wall = new THREE.Mesh(wallGeo, wallMat);
      wall.position.set(x, wallHeight / 2, z);
      wall.rotation.y = ry;
      wall.receiveShadow = true;
      scene.add(wall);
    };

    createWall(0, -roomSize / 2, 0, roomSize);
    createWall(0, roomSize / 2, Math.PI, roomSize);
    createWall(-roomSize / 2, 0, Math.PI / 2, roomSize);
    createWall(roomSize / 2, 0, -Math.PI / 2, roomSize);

    // --- DESTRUCTIBLE OBJECTS (Shelves / Pillars) ---
    function spawnDestructibles() {
      const boxGeo = new THREE.BoxGeometry(2, 4, 2);
      const boxMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b });
      
      const positions = [
        [-15, 2, -15], [15, 2, -15], [-15, 2, 15], [15, 2, 15],
        [0, 2, -10], [-10, 2, 0], [10, 2, 0]
      ];

      positions.forEach(pos => {
        const crate = new THREE.Mesh(boxGeo, boxMat.clone());
        crate.position.set(...pos);
        crate.castShadow = true;
        crate.receiveShadow = true;
        crate.userData = { hp: 3, isDestructible: true };
        scene.add(crate);
        destructibles.push(crate);
      });
    }
    spawnDestructibles();

    // --- PLAYER CONTROLS ---
    camera.position.set(0, 1.6, 20);

    let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
    let yaw = 0, pitch = 0;
    let isLocked = false;

    const instructions = document.getElementById('instructions');

    instructions.addEventListener('click', () => {
      document.body.requestPointerLock();
    });

    document.addEventListener('pointerlockchange', () => {
      if (document.pointerLockElement === document.body) {
        isLocked = true;
        instructions.style.display = 'none';
      } else {
        isLocked = false;
        instructions.style.display = 'flex';
      }
    });

    document.addEventListener('mousemove', (e) => {
      if (!isLocked) return;
      yaw -= e.movementX * 0.002;
      pitch -= e.movementY * 0.002;
      pitch = Math.max(-Math.PI / 2 + 0.1, Math.min(Math.PI / 2 - 0.1, pitch));
    });

    document.addEventListener('keydown', (e) => {
      if (e.code === 'KeyW') moveForward = true;
      if (e.code === 'KeyS') moveBackward = true;
      if (e.code === 'KeyA') moveLeft = true;
      if (e.code === 'KeyD') moveRight = true;
    });

    document.addEventListener('keyup', (e) => {
      if (e.code === 'KeyW') moveForward = false;
      if (e.code === 'KeyS') moveBackward = false;
      if (e.code === 'KeyA') moveLeft = false;
      if (e.code === 'KeyD') moveRight = false;
    });

    document.addEventListener('mousedown', (e) => {
      if (isLocked && e.button === 0) shoot();
    });

    // --- SHOOTING MECHANIC ---
    function shoot() {
      const bulletGeo = new THREE.SphereGeometry(0.2, 8, 8);
      const bulletMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
      const bullet = new THREE.Mesh(bulletGeo, bulletMat);
      
      bullet.position.copy(camera.position);
      
      const dir = new THREE.Vector3(0, 0, -1);
      dir.applyEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
      bullet.userData = { velocity: dir.multiplyScalar(1.2), life: 60 };
      
      bullets.push(bullet);
      scene.add(bullet);
    }

    // --- WAVES & ENEMIES ---
    function spawnWave() {
      const count = wave * 4;
      document.getElementById('wave').innerText = wave;
      
      for (let i = 0; i < count; i++) {
        const enemyGeo = new THREE.BoxGeometry(1.5, 1.5, 1.5);
        const enemyMat = new THREE.MeshStandardMaterial({ color: 0xff2222 });
        const enemy = new THREE.Mesh(enemyGeo, enemyMat);
        
        // Random placement around edges
        const angle = Math.random() * Math.PI * 2;
        const dist = 22 + Math.random() * 5;
        enemy.position.set(Math.cos(angle) * dist, 0.75, Math.sin(angle) * dist);
        enemy.castShadow = true;
        enemy.userData = { hp: 2 };
        
        enemies.push(enemy);
        scene.add(enemy);
      }
      document.getElementById('enemies').innerText = enemies.length;
    }
    spawnWave();

    // --- GAME LOOP ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      if (isLocked) {
        // Player movement
        const delta = clock.getDelta();
        const speed = 10 * delta;
        
        const moveDir = new THREE.Vector3();
        if (moveForward) moveDir.z -= 1;
        if (moveBackward) moveDir.z += 1;
        if (moveLeft) moveDir.x -= 1;
        if (moveRight) moveDir.x += 1;
        moveDir.normalize();

        const euler = new THREE.Euler(0, yaw, 0, 'YXZ');
        moveDir.applyEuler(euler);
        camera.position.addScaledVector(moveDir, speed);

        // Keep player in bounds
        const maxPos = roomSize / 2 - 1.5;
        camera.position.x = Math.max(-maxPos, Math.min(maxPos, camera.position.x));
        camera.position.z = Math.max(-maxPos, Math.min(maxPos, camera.position.z));

        // Camera rotation
        camera.rotation.set(0, 0, 0);
        camera.rotation.y = yaw;
        camera.rotation.x = pitch;

        // Update Bullets
        for (let i = bullets.length - 1; i >= 0; i--) {
          const b = bullets[i];
          b.position.add(b.userData.velocity);
          b.userData.life--;

          // Bullet Collision with Destructibles
          for (let j = destructibles.length - 1; j >= 0; j--) {
            const d = destructibles[j];
            if (b.position.distanceTo(d.position) < 1.5) {
              d.userData.hp--;
              d.material.color.setHex(0x553311); // Damage visual
              if (d.userData.hp <= 0) {
                scene.remove(d);
                destructibles.splice(j, 1);
              }
              scene.remove(b);
              bullets.splice(i, 1);
              break;
            }
          }

          // Bullet Collision with Enemies
          if (bullets[i]) {
            for (let j = enemies.length - 1; j >= 0; j--) {
              const e = enemies[j];
              if (b.position.distanceTo(e.position) < 1.2) {
                e.userData.hp--;
                e.material.color.setHex(0xffffff); // Hit flash
                setTimeout(() => e.material.color.setHex(0xff2222), 50);

                if (e.userData.hp <= 0) {
                  scene.remove(e);
                  enemies.splice(j, 1);
                  document.getElementById('enemies').innerText = enemies.length;
                }
                scene.remove(b);
                bullets.splice(i, 1);
                break;
              }
            }
          }

          // Despawn old bullets
          if (b && b.userData.life <= 0) {
            scene.remove(b);
            bullets.splice(i, 1);
          }
        }

        // Enemy AI (Move towards player)
        enemies.forEach(e => {
          const dir = new THREE.Vector3().subVectors(camera.position, e.position);
          dir.y = 0; // Keep on ground
          dir.normalize();
          e.position.addScaledVector(dir, 4 * delta);

          // Player damage
          if (e.position.distanceTo(camera.position) < 1.2) {
            health -= 0.2;
            document.getElementById('health').innerText = Math.max(0, Math.round(health));
            if (health <= 0) {
              alert('Game Over! Refresh to restart.');
              location.reload();
            }
          }
        });

        // Wave Spawning Logic
        if (enemies.length === 0) {
          wave++;
          spawnWave();
        }
      }

      renderer.render(scene, camera);
    }

    animate();

    // Handle Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
