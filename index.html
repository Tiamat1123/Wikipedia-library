<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Wikipedia Architectural Library</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Georgia', serif;
      background-color: #111;
      user-select: none;
    }
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 8px;
      height: 8px;
      background: white;
      border: 2px solid black;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 10;
    }
    #instructions {
      position: absolute;
      top: 50%;
      width: 100%;
      text-align: center;
      color: #fff;
      font-size: 20px;
      font-weight: bold;
      background: rgba(0, 0, 0, 0.85);
      padding: 25px 0;
      cursor: pointer;
      z-index: 10;
      border-top: 2px solid #aaa;
      border-bottom: 2px solid #aaa;
    }
    /* Floating Book Title Hover Tooltip */
    #hover-title {
      position: absolute;
      bottom: 20%;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.9);
      color: #fff;
      padding: 8px 16px;
      border-radius: 4px;
      border: 1px solid #fff;
      font-size: 16px;
      font-family: sans-serif;
      pointer-events: none;
      display: none;
      z-index: 12;
    }
    /* Top-Right Minimap */
    #minimap-box {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 150px;
      height: 150px;
      background: rgba(255, 255, 255, 0.95);
      border: 3px solid #000;
      box-shadow: 4px 4px 0px #000;
      z-index: 15;
      cursor: pointer;
    }
    #minimap-label {
      position: absolute;
      bottom: 0;
      width: 100%;
      text-align: center;
      font-size: 10px;
      font-family: sans-serif;
      font-weight: bold;
      background: #000;
      color: #fff;
      padding: 2px 0;
    }
    /* Search Desk Overlay */
    #search-modal {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 380px;
      background: #fdfcf7;
      border: 4px solid #000;
      box-shadow: 8px 8px 0px #000;
      padding: 25px;
      z-index: 30;
      text-align: center;
    }
    #search-input {
      width: 85%;
      padding: 10px;
      font-family: inherit;
      font-size: 16px;
      border: 2px solid #000;
      margin-bottom: 15px;
    }
    /* Full Map Fast Travel Modal */
    #full-map-modal {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80%;
      max-width: 650px;
      background: #fdfcf7;
      border: 4px solid #000;
      box-shadow: 8px 8px 0px #000;
      padding: 25px;
      z-index: 30;
    }
    #full-map-modal h2 { margin-top: 0; text-align: center; border-bottom: 2px solid black; padding-bottom: 10px; }
    .map-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 20px; }
    .map-btn { padding: 15px; background: #fff; border: 2px solid #000; font-weight: bold; font-family: inherit; cursor: pointer; text-align: center; box-shadow: 3px 3px 0px #000; }
    .map-btn:hover { background: #000; color: #fff; }
    
    /* Book Reader Overlay */
    #book-modal {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 75%;
      max-width: 750px;
      height: 80vh;
      background: #fdfcf7;
      color: #111;
      border: 5px solid #222;
      box-shadow: 12px 12px 0px #000;
      padding: 35px;
      box-sizing: border-box;
      overflow-y: auto;
      z-index: 25;
    }
    #book-modal h1 { margin-top: 0; border-bottom: 3px double #111; padding-bottom: 10px; font-size: 30px; }
    #book-content p { font-size: 17px; line-height: 1.8; text-indent: 20px; }
    .ui-btn { margin-top: 15px; padding: 10px 20px; background: #000; color: #fff; border: none; font-family: inherit; font-weight: bold; cursor: pointer; font-size: 14px; }
    .ui-btn:hover { background: #444; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
</head>
<body>

  <div id="crosshair"></div>
  <div id="hover-title"></div>
  <div id="instructions">ENTER THE WIKIPEDIA LIBRARY<br><small>(Click to Walk | WASD = Move | Look at Book = See Title | Click Book = Read | M = Map)</small></div>

  <!-- Top-Right Minimap -->
  <div id="minimap-box" onclick="toggleFullMap(true)">
    <canvas id="minimap-canvas" width="150" height="150"></canvas>
    <div id="minimap-label">FAST TRAVEL MAP (M)</div>
  </div>

  <!-- Search Desk Modal -->
  <div id="search-modal">
    <h3>LIBRARY SEARCH DESK</h3>
    <p>Enter any topic to restock the Central Search Shelf:</p>
    <input type="text" id="search-input" placeholder="e.g. Quantum Physics, Mythology..." onkeydown="if(event.key==='Enter') executeSearch()">
    <br>
    <button class="ui-btn" onclick="executeSearch()">Restock Shelf</button>
    <button class="ui-btn" style="background:#666;" onclick="closeSearch()">Cancel</button>
  </div>

  <!-- Fast Travel Map Modal -->
  <div id="full-map-modal">
    <h2>LIBRARY MAP & FAST TRAVEL</h2>
    <div class="map-grid">
      <button class="map-btn" onclick="teleportTo(0, 0)">CENTRAL LOBBY & DESK</button>
      <button class="map-btn" onclick="teleportTo(-20, 0)">SCIENCE WING</button>
      <button class="map-btn" onclick="teleportTo(20, 0)">HISTORY WING</button>
      <button class="map-btn" onclick="teleportTo(0, -20)">TECH WING</button>
      <button class="map-btn" onclick="teleportTo(0, 20)">ARTS WING</button>
      <button class="map-btn" onclick="teleportTo(-20, -20)">PHILOSOPHY WING</button>
    </div>
    <div style="text-align: center; margin-top: 20px;">
      <button class="ui-btn" onclick="toggleFullMap(false)">Close Map</button>
    </div>
  </div>

  <!-- Book Reader UI Overlay -->
  <div id="book-modal">
    <h1 id="book-title">Loading...</h1>
    <div id="book-content">Fetching article contents...</div>
    <button class="ui-btn" onclick="closeBook()">Close & Put Back Book (ESC)</button>
  </div>

  <script>
    // --- 1. THREE.JS SCENE SETUP ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xdcd6cd); // Warm parchment atmosphere
    scene.fog = new THREE.FogExp2(0xdcd6cd, 0.025);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.6, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Warm Ambient & Directional Lighting
    const ambientLight = new THREE.AmbientLight(0xfff5ea, 0.8);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffeecc, 0.6);
    dirLight.position.set(10, 20, 10);
    scene.add(dirLight);

    // Floor Texture Grid
    const floorGeo = new THREE.PlaneGeometry(100, 100);
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x33261d, roughness: 0.8 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    // --- 2. COLLISION & INTERACTION TRACKING ---
    const colliders = [];
    const interactiveObjects = [];
    const raycaster = new THREE.Raycaster();

    // --- 3. SEARCH DESK & CENTRAL SHELF ---
    const deskGeo = new THREE.BoxGeometry(3, 1.1, 1.4);
    const deskMat = new THREE.MeshStandardMaterial({ color: 0x1a120c });
    const searchDesk = new THREE.Mesh(deskGeo, deskMat);
    searchDesk.position.set(0, 0.55, -3);
    searchDesk.userData = { type: 'searchDesk' };
    scene.add(searchDesk);
    interactiveObjects.push(searchDesk);
    colliders.push(searchDesk);

    let searchShelfGroup = new THREE.Group();
    searchShelfGroup.position.set(0, 0, -6);
    scene.add(searchShelfGroup);

    function buildShelfStructure(group, x, y, z, rotY) {
      group.position.set(x, y, z);
      group.rotation.y = rotY;

      // Wooden Frame
      const frameGeo = new THREE.BoxGeometry(4.5, 3.2, 0.6);
      const frameMat = new THREE.MeshStandardMaterial({ color: 0x2b1d14 });
      const frame = new THREE.Mesh(frameGeo, frameMat);
      frame.position.y = 1.6;
      group.add(frame);
      colliders.push(frame);
    }

    function populateBooksOnShelf(group, titles) {
      // Clear old books
      for(let i = group.children.length - 1; i >= 0; i--) {
        const obj = group.children[i];
        if(obj.userData && obj.userData.type === 'book') {
          const idx = interactiveObjects.indexOf(obj);
          if (idx > -1) interactiveObjects.splice(idx, 1);
          group.remove(obj);
        }
      }

      // Add labeled books
      titles.forEach((title, i) => {
        const bookGeo = new THREE.BoxGeometry(0.25, 0.7, 0.45);
        const bookMat = new THREE.MeshStandardMaterial({ color: (i % 2 === 0) ? 0x8b0000 : 0x1a365d });
        const book = new THREE.Mesh(bookGeo, bookMat);
        book.position.set(-1.8 + (i * 0.5), 1.6, 0);
        book.userData = { type: 'book', title: title };
        group.add(book);
        interactiveObjects.push(book);
      });
    }

    buildShelfStructure(searchShelfGroup, 0, 0, -6, 0);
    populateBooksOnShelf(searchShelfGroup, ["Wikipedia", "Library of Alexandria", "Encyclopedia", "Printing press"]);

    // --- 4. WINGS & CATEGORY SHELVES ---
    const categories = [
      { name: "Science", x: -20, z: 0, topics: ["Physics", "Quantum mechanics", "Astronomy", "Biology"] },
      { name: "History", x: 20, z: 0, topics: ["Ancient Egypt", "Roman Empire", "Industrial Revolution", "Renaissance"] },
      { name: "Technology", x: 0, z: -20, topics: ["Computer science", "Artificial intelligence", "Internet", "Robotics"] },
      { name: "Arts", x: 0, z: 20, topics: ["Architecture", "Sculpture", "Music history", "Cinema"] },
      { name: "Philosophy", x: -20, z: -20, topics: ["Ethics", "Logic", "Epistemology", "Metaphysics"] }
    ];

    categories.forEach(cat => {
      const wingGroup = new THREE.Group();
      scene.add(wingGroup);
      buildShelfStructure(wingGroup, cat.x, 0, cat.z, 0);
      populateBooksOnShelf(wingGroup, cat.topics);
    });

    // --- 5. FIRST PERSON CONTROLS & COLLISION SYSTEM ---
    const controls = new THREE.PointerLockControls(camera, document.body);
    const instructions = document.getElementById('instructions');
    const hoverTitle = document.getElementById('hover-title');
    const searchModal = document.getElementById('search-modal');
    const fullMapModal = document.getElementById('full-map-modal');
    const bookModal = document.getElementById('book-modal');

    instructions.addEventListener('click', () => controls.lock());
    controls.addEventListener('lock', () => instructions.style.display = 'none');
    controls.addEventListener('unlock', () => {
      if (searchModal.style.display !== 'block' && fullMapModal.style.display !== 'block' && bookModal.style.display !== 'block') {
        instructions.style.display = '';
      }
    });

    let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
    const velocity = new THREE.Vector3();
    const direction = new THREE.Vector3();
    let prevTime = performance.now();

    document.addEventListener('keydown', (e) => {
      if (e.code === 'KeyW' || e.code === 'ArrowUp') moveForward = true;
      if (e.code === 'KeyS' || e.code === 'ArrowDown') moveBackward = true;
      if (e.code === 'KeyA' || e.code === 'ArrowLeft') moveLeft = true;
      if (e.code === 'KeyD' || e.code === 'ArrowRight') moveRight = true;
      if (e.code === 'KeyM') toggleFullMap(true);
      if (e.code === 'Escape') {
        closeBook();
        closeSearch();
        toggleFullMap(false);
      }
    });

    document.addEventListener('keyup', (e) => {
      if (e.code === 'KeyW' || e.code === 'ArrowUp') moveForward = false;
      if (e.code === 'KeyS' || e.code === 'ArrowDown') moveBackward = false;
      if (e.code === 'KeyA' || e.code === 'ArrowLeft') moveLeft = false;
      if (e.code === 'KeyD' || e.code === 'ArrowRight') moveRight = false;
    });

    // --- 6. INTERACTION & RAYCASTING ---
    document.addEventListener('click', () => {
      if (!controls.isLocked) return;

      raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
      const intersects = raycaster.intersectObjects(interactiveObjects);

      if (intersects.length > 0) {
        const hit = intersects[0].object;
        if (hit.userData.type === 'searchDesk') {
          openSearch();
        } else if (hit.userData.type === 'book') {
          openWikipediaArticle(hit.userData.title);
        }
      }
    });

    function checkHoverTitles() {
      if (!controls.isLocked) {
        hoverTitle.style.display = 'none';
        return;
      }
      raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
      const intersects = raycaster.intersectObjects(interactiveObjects);

      if (intersects.length > 0) {
        const hit = intersects[0].object;
        if (hit.userData.type === 'book') {
          hoverTitle.style.display = 'block';
          hoverTitle.innerText = `Book: "${hit.userData.title}" (Click to Read)`;
        } else if (hit.userData.type === 'searchDesk') {
          hoverTitle.style.display = 'block';
          hoverTitle.innerText = `Search Terminal Desk (Click to Search Topic)`;
        }
      } else {
        hoverTitle.style.display = 'none';
      }
    }

    // --- 7. MODALS & API FETCHING ---
    function openSearch() {
      controls.unlock();
      searchModal.style.display = 'block';
      document.getElementById('search-input').focus();
    }

    function closeSearch() {
      searchModal.style.display = 'none';
    }

    async function executeSearch() {
      const query = document.getElementById('search-input').value.trim();
      if (!query) return;

      closeSearch();

      try {
        const url = `https://en.wikipedia.org/w/api.php?action=opensearch&search=${encodeURIComponent(query)}&limit=7&format=json&origin=*`;
        const res = await fetch(url);
        const data = await res.json();
        const titles = data[1] || [];
        if (titles.length > 0) {
          populateBooksOnShelf(searchShelfGroup, titles);
        }
      } catch (e) { console.error("Search failed:", e); }
    }

    async function openWikipediaArticle(title) {
      controls.unlock();
      bookModal.style.display = 'block';
      document.getElementById('book-title').innerText = title;
      document.getElementById('book-content').innerHTML = "<p>Opening book and fetching Wikipedia text...</p>";

      try {
        const url = `https://en.wikipedia.org/api/rest_v1/page/html/${encodeURIComponent(title)}`;
        const res = await fetch(url);
        const htmlText = await res.text();
        const parser = new DOMParser();
        const doc = parser.parseFromString(htmlText, 'text/html');
        const paragraphs = Array.from(doc.querySelectorAll('p')).map(p => p.outerHTML).join('');
        document.getElementById('book-content').innerHTML = paragraphs || "<p>Summary unavailable for this article.</p>";
      } catch (e) {
        document.getElementById('book-content').innerText = "Failed to load article from Wikipedia.";
      }
    }

    function closeBook() {
      bookModal.style.display = 'none';
    }

    function toggleFullMap(show) {
      if (show) { controls.unlock(); fullMapModal.style.display = 'block'; }
      else { fullMapModal.style.display = 'none'; }
    }

    function teleportTo(x, z) {
      camera.position.set(x, 1.6, z);
      toggleFullMap(false);
      controls.lock();
    }

    // --- 8. MINIMAP & ANIMATION LOOP ---
    const minimapCanvas = document.getElementById('minimap-canvas');
    const ctx = minimapCanvas.getContext('2d');

    function drawMinimap() {
      ctx.clearRect(0, 0, 150, 150);
      ctx.fillStyle = '#e6dfd5';
      ctx.fillRect(0, 0, 150, 150);

      // Draw Center Hub
      ctx.strokeStyle = '#000';
      ctx.strokeRect(65, 65, 20, 20);

      // Draw Wings
      ctx.fillStyle = '#444';
      categories.forEach(cat => {
        const mx = 75 + (cat.x * 2.5);
        const mz = 75 + (cat.z * 2.5);
        ctx.fillRect(mx - 5, mz - 5, 10, 10);
      });

      // Draw Player Position Dot
      const px = 75 + (camera.position.x * 2.5);
      const pz = 75 + (camera.position.z * 2.5);
      ctx.fillStyle = 'red';
      ctx.beginPath();
      ctx.arc(px, pz, 4, 0, Math.PI * 2);
      ctx.fill();
    }

    function animate() {
      requestAnimationFrame(animate);

      const time = performance.now();
      if (controls.isLocked) {
        const delta = (time - prevTime) / 1000;

        velocity.x -= velocity.x * 10.0 * delta;
        velocity.z -= velocity.z * 10.0 * delta;

        direction.z = Number(moveForward) - Number(moveBackward);
        direction.x = Number(moveRight) - Number(moveLeft);
        direction.normalize();

        if (moveForward || moveBackward) velocity.z -= direction.z * 30.0 * delta;
        if (moveLeft || moveRight) velocity.x -= direction.x * 30.0 * delta;

        // Save old position for collision checks
        const oldPos = camera.position.clone();

        controls.moveRight(-velocity.x * delta);
        controls.moveForward(-velocity.z * delta);

        // Simple AABB Collision box check against shelves & desk
        const playerRadius = 0.5;
        colliders.forEach(obj => {
          const box = new THREE.Box3().setFromObject(obj);
          const playerBox = new THREE.Box3(
            new THREE.Vector3(camera.position.x - playerRadius, 0, camera.position.z - playerRadius),
            new THREE.Vector3(camera.position.x + playerRadius, 2, camera.position.z + playerRadius)
          );
          if (box.intersectsBox(playerBox)) {
            camera.position.copy(oldPos); // Revert position on collision
          }
        });
      }
      prevTime = time;

      checkHoverTitles();
      drawMinimap();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
