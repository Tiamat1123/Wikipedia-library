<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Wikipedia Infinite Library</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Courier New', Courier, monospace;
      background-color: #000;
      user-select: none;
    }
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 6px;
      height: 6px;
      background: black;
      border: 2px solid white;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 10;
    }
    #instructions {
      position: absolute;
      top: 50%;
      width: 100%;
      text-align: center;
      color: #000;
      font-size: 20px;
      font-weight: bold;
      background: rgba(255, 255, 255, 0.95);
      padding: 20px 0;
      cursor: pointer;
      z-index: 10;
      border-top: 3px solid black;
      border-bottom: 3px solid black;
    }
    /* Minimap Widget */
    #minimap-box {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 160px;
      height: 160px;
      background: rgba(255, 255, 255, 0.9);
      border: 3px solid black;
      box-shadow: 4px 4px 0px black;
      z-index: 15;
      cursor: pointer;
    }
    #minimap-label {
      position: absolute;
      bottom: 2px;
      width: 100%;
      text-align: center;
      font-size: 11px;
      font-weight: bold;
      background: #000;
      color: #fff;
    }
    /* Full Fast-Travel Map Overlay */
    #full-map-modal {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80%;
      max-width: 700px;
      background: #fdfcf7;
      border: 4px solid #000;
      box-shadow: 8px 8px 0px #000;
      padding: 25px;
      z-index: 30;
    }
    #full-map-modal h2 {
      margin-top: 0;
      text-align: center;
      border-bottom: 2px solid black;
      padding-bottom: 10px;
    }
    .map-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-top: 20px;
    }
    .map-btn {
      padding: 15px;
      background: #fff;
      border: 2px solid #000;
      font-weight: bold;
      font-family: inherit;
      cursor: pointer;
      text-align: center;
      box-shadow: 3px 3px 0px #000;
    }
    .map-btn:hover {
      background: #000;
      color: #fff;
    }
    /* Book Overlay Reader UI */
    #book-modal {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 75%;
      max-width: 750px;
      height: 80vh;
      background: #fdfcf7;
      color: #111;
      border: 4px solid #111;
      box-shadow: 10px 10px 0px #000;
      padding: 30px;
      box-sizing: border-box;
      overflow-y: auto;
      z-index: 25;
    }
    #book-modal h1 {
      margin-top: 0;
      border-bottom: 3px double #111;
      padding-bottom: 10px;
    }
    #book-content p {
      font-size: 16px;
      line-height: 1.8;
      text-indent: 20px;
    }
    .ui-btn {
      margin-top: 15px;
      padding: 10px 20px;
      background: #000;
      color: #fff;
      border: none;
      font-family: inherit;
      font-weight: bold;
      cursor: pointer;
    }
    .ui-btn:hover { background: #444; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
</head>
<body>

  <div id="crosshair"></div>
  <div id="instructions">WELCOME TO THE WIKIPEDIA 3D LIBRARY<br><small>(Click to start walking | WASD = Move | Click Book = Read | M = Map)</small></div>

  <!-- Top-Right Minimap -->
  <div id="minimap-box" onclick="toggleFullMap(true)">
    <canvas id="minimap-canvas" width="160" height="160"></canvas>
    <div id="minimap-label">CLICK FOR FAST TRAVEL</div>
  </div>

  <!-- Full Fast Travel Map Modal -->
  <div id="full-map-modal">
    <h2>LIBRARY MAP & FAST TRAVEL</h2>
    <div class="map-grid">
      <button class="map-btn" onclick="teleportTo('Hub', 0, 0)">CENTRAL HUB</button>
      <button class="map-btn" onclick="teleportTo('Science', -25, 0)">SCIENCE WING</button>
      <button class="map-btn" onclick="teleportTo('History', 25, 0)">HISTORY WING</button>
      <button class="map-btn" onclick="teleportTo('Technology', 0, -25)">TECH WING</button>
      <button class="map-btn" onclick="teleportTo('Arts', 0, 25)">ARTS WING</button>
      <button class="map-btn" onclick="teleportTo('Philosophy', -25, -25)">PHILOSOPHY</button>
    </div>
    <div style="text-align: center; margin-top: 20px;">
      <button class="ui-btn" onclick="toggleFullMap(false)">Close Map</button>
    </div>
  </div>

  <!-- Book Reader UI Overlay -->
  <div id="book-modal">
    <h1 id="book-title">Loading...</h1>
    <div id="book-content">Fetching article contents...</div>
    <button class="ui-btn" onclick="closeBook()">Close & Return to Library (ESC)</button>
  </div>

  <script>
    // --- 1. SETUP THREE.JS & BLACK/WHITE STYLE ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf5f5f5);
    scene.fog = new THREE.Fog(0xf5f5f5, 5, 45);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.6, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
    scene.add(ambientLight);

    const gridFloor = new THREE.GridHelper(100, 100, 0x000000, 0xcccccc);
    scene.add(gridFloor);

    // --- 2. GENERATE LIBRARY WINGS & SHELVES ---
    const interactiveBooks = [];
    const raycaster = new THREE.Raycaster();

    const categories = [
      { name: "Science", x: -25, z: 0, topics: ["Physics", "Biology", "Astronomy", "Chemistry"] },
      { name: "History", x: 25, z: 0, topics: ["Ancient Egypt", "World War II", "Renaissance", "Roman Empire"] },
      { name: "Technology", x: 0, z: -25, topics: ["Computer science", "Artificial intelligence", "Internet", "Robotics"] },
      { name: "Arts", x: 0, z: 25, topics: ["Sculpture", "Music history", "Architecture", "Cinema"] },
      { name: "Philosophy", x: -25, z: -25, topics: ["Ethics", "Logic", "Epistemology", "Metaphysics"] }
    ];

    function createBookShelf(x, z, rotationY, articleTitles) {
      const shelfGroup = new THREE.Group();
      shelfGroup.position.set(x, 0, z);
      shelfGroup.rotation.y = rotationY;

      // Bookcase Frame
      const frameGeo = new THREE.BoxGeometry(4, 3, 0.6);
      const frameMat = new THREE.MeshBasicMaterial({ color: 0x000000, wireframe: true });
      const frame = new THREE.Mesh(frameGeo, frameMat);
      frame.position.y = 1.5;
      shelfGroup.add(frame);

      // Books on Shelves
      articleTitles.forEach((title, index) => {
        const bookGeo = new THREE.BoxGeometry(0.2, 0.6, 0.4);
        const bookMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
        const book = new THREE.Mesh(bookGeo, bookMat);

        book.position.set(-1.5 + (index * 0.8), 1.5, 0);
        book.userData = { title: title };
        shelfGroup.add(book);
        interactiveBooks.push(book);
      });

      scene.add(shelfGroup);
    }

    // Build central hub indicator
    const hubGeo = new THREE.CylinderGeometry(2, 2, 0.1, 16);
    const hubMat = new THREE.MeshBasicMaterial({ color: 0x000000, wireframe: true });
    const hub = new THREE.Mesh(hubGeo, hubMat);
    scene.add(hub);

    // Build Wing Shelves
    categories.forEach(cat => {
      createBookShelf(cat.x, cat.z - 2, 0, cat.topics);
      createBookShelf(cat.x, cat.z + 2, Math.PI, cat.topics);
    });

    // --- 3. FIRST PERSON CONTROLS ---
    const controls = new THREE.PointerLockControls(camera, document.body);
    const instructions = document.getElementById('instructions');
    const fullMapModal = document.getElementById('full-map-modal');
    const bookModal = document.getElementById('book-modal');

    instructions.addEventListener('click', () => controls.lock());
    controls.addEventListener('lock', () => instructions.style.display = 'none');
    controls.addEventListener('unlock', () => {
      if (fullMapModal.style.display !== 'block' && bookModal.style.display !== 'block') {
        instructions.style.display = '';
      }
    });

    let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
    const velocity = new THREE.Vector3();
    const direction = new THREE.Vector3();
    let prevTime = performance.now();

    document.addEventListener('keydown', (e) => {
      if (e.code === 'KeyW' || e.code === 'ArrowUp') moveForward = true;
      if (e.code === 'KeyS' || e.code === 'ArrowDown') moveBackward = true;
      if (e.code === 'KeyA' || e.code === 'ArrowLeft') moveLeft = true;
      if (e.code === 'KeyD' || e.code === 'ArrowRight') moveRight = true;
      if (e.code === 'KeyM') toggleFullMap(true);
    });

    document.addEventListener('keyup', (e) => {
      if (e.code === 'KeyW' || e.code === 'ArrowUp') moveForward = false;
      if (e.code === 'KeyS' || e.code === 'ArrowDown') moveBackward = false;
      if (e.code === 'KeyA' || e.code === 'ArrowLeft') moveLeft = false;
      if (e.code === 'KeyD' || e.code === 'ArrowRight') moveRight = false;
    });

    // --- 4. FAST TRAVEL & MAP SYSTEM ---
    function toggleFullMap(show) {
      if (show) {
        controls.unlock();
        fullMapModal.style.display = 'block';
      } else {
        fullMapModal.style.display = 'none';
        controls.lock();
      }
    }

    function teleportTo(locationName, x, z) {
      camera.position.set(x, 1.6, z);
      toggleFullMap(false);
    }

    // --- 5. INTERACTIVE WIKIPEDIA FETCHING ---
    document.addEventListener('click', () => {
      if (!controls.isLocked) return;

      raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
      const intersects = raycaster.intersectObjects(interactiveBooks);

      if (intersects.length > 0) {
        const book = intersects[0].object;
        openWikipediaArticle(book.userData.title);
      }
    });

    async function openWikipediaArticle(title) {
      controls.unlock();
      bookModal.style.display = 'block';
      document.getElementById('book-title').innerText = title;
      document.getElementById('book-content').innerHTML = "<p>Opening book from Wikipedia library...</p>";

      try {
        const response = await fetch(`https://en.wikipedia.org/api/rest_v1/page/html/${encodeURIComponent(title)}`);
        const htmlText = await response.text();
        
        // Sanitize & format HTML for book reader
        const parser = new DOMParser();
        const doc = parser.parseFromString(htmlText, 'text/html');
        const paragraphs = Array.from(doc.querySelectorAll('p')).map(p => p.outerHTML).join('');

        document.getElementById('book-content').innerHTML = paragraphs || "<p>Empty article section.</p>";
      } catch (err) {
        document.getElementById('book-content').innerText = "Could not load full article from Wikipedia API.";
      }
    }

    function closeBook() {
      bookModal.style.display = 'none';
      controls.lock();
    }

    // --- 6. MINIMAP & RENDER LOOP ---
    const minimapCanvas = document.getElementById('minimap-canvas');
    const ctx = minimapCanvas.getContext('2d');

    function drawMinimap() {
      ctx.clearRect(0, 0, 160, 160);
      ctx.fillStyle = '#f5f5f5';
      ctx.fillRect(0, 0, 160, 160);

      // Draw Center Hub
      ctx.strokeStyle = '#000';
      ctx.strokeRect(70, 70, 20, 20);

      // Draw Wings
      ctx.fillStyle = '#000';
      categories.forEach(cat => {
        const mapX = 80 + (cat.x * 2.2);
        const mapZ = 80 + (cat.z * 2.2);
        ctx.fillRect(mapX - 5, mapZ - 5, 10, 10);
      });

      // Draw Player Position dot
      const px = 80 + (camera.position.x * 2.2);
      const pz = 80 + (camera.position.z * 2.2);
      ctx.fillStyle = 'red';
      ctx.beginPath();
      ctx.arc(px, pz, 4, 0, Math.PI * 2);
      ctx.fill();
    }

    function animate() {
      requestAnimationFrame(animate);

      const time = performance.now();
      if (controls.isLocked) {
        const delta = (time - prevTime) / 1000;

        velocity.x -= velocity.x * 10.0 * delta;
        velocity.z -= velocity.z * 10.0 * delta;

        direction.z = Number(moveForward) - Number(moveBackward);
        direction.x = Number(moveRight) - Number(moveLeft);
        direction.normalize();

        if (moveForward || moveBackward) velocity.z -= direction.z * 40.0 * delta;
        if (moveLeft || moveRight) velocity.x -= direction.x * 40.0 * delta;

        controls.moveRight(-velocity.x * delta);
        controls.moveForward(-velocity.z * delta);
      }
      prevTime = time;

      drawMinimap();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
