<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Wikipedia Library</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Courier New', Courier, monospace;
      background-color: #000;
    }
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 8px;
      height: 8px;
      background: black;
      border: 2px solid white;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 10;
    }
    #instructions {
      position: absolute;
      top: 50%;
      width: 100%;
      text-align: center;
      color: #000;
      font-size: 20px;
      font-weight: bold;
      background: rgba(255, 255, 255, 0.9);
      padding: 20px 0;
      cursor: pointer;
      z-index: 10;
      border-top: 2px solid black;
      border-bottom: 2px solid black;
    }
    /* Book Overlay Reader UI */
    #book-modal {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 70%;
      max-width: 600px;
      max-height: 80vh;
      background: #fdfcf7;
      color: #111;
      border: 4px solid #111;
      box-shadow: 10px 10px 0px #000;
      padding: 30px;
      overflow-y: auto;
      z-index: 20;
    }
    #book-modal h2 {
      margin-top: 0;
      border-bottom: 2px solid #111;
      padding-bottom: 10px;
      font-size: 28px;
    }
    #book-modal p {
      font-size: 16px;
      line-height: 1.6;
    }
    #close-btn {
      margin-top: 20px;
      padding: 8px 16px;
      background: #111;
      color: #fff;
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-weight: bold;
    }
    #close-btn:hover {
      background: #444;
    }
  </style>
  <!-- Three.js Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
</head>
<body>

  <div id="crosshair"></div>
  <div id="instructions">CLICK TO ENTER 3D LIBRARY<br><small>(WASD = Move | Mouse = Look | Click Book = Read)</small></div>

  <!-- Book Reader UI -->
  <div id="book-modal">
    <h2 id="book-title">Loading Article...</h2>
    <p id="book-content">Fetching text from Wikipedia...</p>
    <button id="close-btn" onclick="closeBook()">Close Book (ESC)</button>
  </div>

  <script>
    // --- 1. SCENE SETUP (Black & White Aesthetic) ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf0f0f0); // Off-white paper background
    scene.fog = new THREE.Fog(0xf0f0f0, 10, 50);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.6, 5); // Start position

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // --- 2. LIGHTING & STYLED ENVIRONMENT ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.4);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    // Grid Floor (Hand-drawn / Sketchy feel)
    const gridHelper = new THREE.GridHelper(60, 60, 0x000000, 0x444444);
    gridHelper.position.y = 0;
    scene.add(gridHelper);

    // --- 3. CREATE INTERACTIVE BOOKS & PEDESTALS ---
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const interactiveObjects = [];

    function createBookPedestal(x, z, articleTitle) {
      // Black wireframe pedestal
      const pedGeo = new THREE.BoxGeometry(0.8, 1, 0.8);
      const pedMat = new THREE.MeshBasicMaterial({ color: 0x000000, wireframe: true });
      const pedestal = new THREE.Mesh(pedGeo, pedMat);
      pedestal.position.set(x, 0.5, z);
      scene.add(pedestal);

      // Book object
      const bookGeo = new THREE.BoxGeometry(0.5, 0.7, 0.15);
      const bookMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
      const book = new THREE.Mesh(bookGeo, bookMat);
      book.position.set(x, 1.2, z);
      book.rotation.x = 0.3;
      book.userData = { articleTitle: articleTitle }; // Attach Wikipedia topic name

      scene.add(book);
      interactiveObjects.push(book);
    }

    // Place 3 sample books in the library
    createBookPedestal(0, 0, "Computer programming");
    createBookPedestal(-3, -2, "Library of Alexandria");
    createBookPedestal(3, -2, "Space exploration");

    // --- 4. FIRST-PERSON CONTROLS ---
    const controls = new THREE.PointerLockControls(camera, document.body);
    const instructions = document.getElementById('instructions');
    const bookModal = document.getElementById('book-modal');

    instructions.addEventListener('click', () => {
      controls.lock();
    });

    controls.addEventListener('lock', () => {
      instructions.style.display = 'none';
    });

    controls.addEventListener('unlock', () => {
      if (bookModal.style.display !== 'block') {
        instructions.style.display = '';
      }
    });

    let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
    const velocity = new THREE.Vector3();
    const direction = new THREE.Vector3();
    let prevTime = performance.now();

    document.addEventListener('keydown', (e) => {
      if (e.code === 'KeyW' || e.code === 'ArrowUp') moveForward = true;
      if (e.code === 'KeyS' || e.code === 'ArrowDown') moveBackward = true;
      if (e.code === 'KeyA' || e.code === 'ArrowLeft') moveLeft = true;
      if (e.code === 'KeyD' || e.code === 'ArrowRight') moveRight = true;
    });

    document.addEventListener('keyup', (e) => {
      if (e.code === 'KeyW' || e.code === 'ArrowUp') moveForward = false;
      if (e.code === 'KeyS' || e.code === 'ArrowDown') moveBackward = false;
      if (e.code === 'KeyA' || e.code === 'ArrowLeft') moveLeft = false;
      if (e.code === 'KeyD' || e.code === 'ArrowRight') moveRight = false;
    });

    // --- 5. INTERACT & WIKIPEDIA FETCHING ---
    document.addEventListener('click', () => {
      if (!controls.isLocked) return;

      // Raycast straight from center of screen
      raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
      const intersects = raycaster.intersectObjects(interactiveObjects);

      if (intersects.length > 0) {
        const selectedBook = intersects[0].object;
        openBook(selectedBook.userData.articleTitle);
      }
    });

    async function openBook(title) {
      controls.unlock();
      bookModal.style.display = 'block';
      document.getElementById('book-title').innerText = title;
      document.getElementById('book-content').innerText = "Opening Wikipedia book page...";

      try {
        const response = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`);
        const data = await response.json();
        document.getElementById('book-content').innerText = data.extract || "No article description found.";
      } catch (err) {
        document.getElementById('book-content').innerText = "Error loading article from Wikipedia API.";
      }
    }

    function closeBook() {
      bookModal.style.display = 'none';
      controls.lock();
    }

    // --- 6. RENDER LOOP ---
    function animate() {
      requestAnimationFrame(animate);

      const time = performance.now();
      if (controls.isLocked) {
        const delta = (time - prevTime) / 1000;

        velocity.x -= velocity.x * 10.0 * delta;
        velocity.z -= velocity.z * 10.0 * delta;

        direction.z = Number(moveForward) - Number(moveBackward);
        direction.x = Number(moveRight) - Number(moveLeft);
        direction.normalize();

        if (moveForward || moveBackward) velocity.z -= direction.z * 40.0 * delta;
        if (moveLeft || moveRight) velocity.x -= direction.x * 40.0 * delta;

        controls.moveRight(-velocity.x * delta);
        controls.moveForward(-velocity.z * delta);
      }
      prevTime = time;

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
